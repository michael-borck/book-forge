name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      # Let every platform finish so one failure does not hide the others.
      fail-fast: false
      matrix:
        include:
          # Pin the Electron macOS job. electron-builder 24's automatic
          # temporary-keychain import fails on newer macOS runners; macos-15 is
          # the known-good runner used by the other Electron releases.
          - os: macos-15
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      # electron-builder's snap target shells out to snapcraft, which is not
      # preinstalled on every Ubuntu runner.
      - name: Install snapcraft
        if: matrix.os == 'ubuntu-latest'
        run: sudo snap install snapcraft --classic

      # Write the App Store Connect API key to a temp file for @electron/notarize.
      # scripts/notarize.js prefers this over the legacy Apple ID credentials.
      - name: Prepare App Store Connect API key (macOS)
        if: matrix.os == 'macos-15'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ] && [ -n "$APPLE_API_KEY" ]; then
            mkdir -p "$RUNNER_TEMP/apple-api"
            KEY_PATH="$RUNNER_TEMP/apple-api/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" | openssl base64 -d -A > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
            echo "Prepared App Store Connect API key"
          else
            echo "No API key secrets; notarization will use Apple ID if configured"
          fi

      # macOS: code-sign + notarize. electron-builder imports the signing
      # certificate itself from CSC_LINK / CSC_KEY_PASSWORD (no manual keychain
      # step - that approach hit keychain-partition codesign failures on the
      # Electron framework's resource files). scripts/notarize.js prefers the
      # API key variables (APPLE_API_KEY_PATH / APPLE_API_KEY / APPLE_API_ISSUER)
      # and falls back to NOTARIZE_APPLE_*.
      - name: Package Electron app (macOS)
        if: matrix.os == 'macos-15'
        # An UNSET CSC_LINK secret arrives as an empty string, which
        # electron-builder treats as a certificate file path and dies on
        # ("not a file"). Unset it and disable identity discovery so the build
        # proceeds unsigned until real signing secrets are configured.
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            unset NOTARIZE_APPLE_ID NOTARIZE_APPLE_PASSWORD NOTARIZE_APPLE_TEAM_ID
            unset APPLE_API_KEY_PATH APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_CONTENT
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "CSC_LINK not set - building unsigned"
            npx electron-builder --mac --arm64 --publish never
            exit $?
          fi

          # Signing secrets can rot (certificate rotated, wrong keychain
          # password). A broken signing setup should not block a release: fall
          # back to an unsigned DMG and surface the failure loudly.
          # Actions runs bash with -e, so disable it while capturing the status.
          set +e
          npx electron-builder --mac --arm64 --publish never
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            echo "::warning::Signed macOS build failed (status $status); retrying unsigned. Fix CSC_LINK/CSC_KEY_PASSWORD to restore signing."
            rm -rf release
            unset CSC_LINK CSC_KEY_PASSWORD
            unset NOTARIZE_APPLE_ID NOTARIZE_APPLE_PASSWORD NOTARIZE_APPLE_TEAM_ID
            unset APPLE_API_KEY_PATH APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_CONTENT
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --mac --arm64 --publish never
          fi
          exit $?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Canonical names first; legacy names keep old repos working.
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE || secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          # Legacy fallback for notarization.
          NOTARIZE_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZE_APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARIZE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package Electron app (Windows/Linux)
        if: matrix.os != 'macos-15'
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.snap
            release/*.yml
            release/*.blockmap
          if-no-files-found: ignore
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.snap
            artifacts/**/latest*.yml
            artifacts/**/*.blockmap
          # Publish as a draft so the release can be reviewed before going public.
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
